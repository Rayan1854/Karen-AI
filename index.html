<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karen AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      background: #111827;
    }

    .header {
      padding: 18px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user {
      margin-left: auto;
      background: #2563eb;
      border-bottom-right-radius: 4px;
    }

    .message.karen {
      margin-right: auto;
      background: #334155;
      border-bottom-left-radius: 4px;
    }

    .typing {
      color: #94a3b8;
      font-style: italic;
      margin: 10px 0;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    #messageInput::placeholder {
      color: #64748b;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    @media (max-width: 500px) {
      .app {
        max-height: none;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>🤖 Karen AI</h1>
      <p>Tu asistente virtual</p>
    </div>

    <div id="chat">

      <div class="message karen">
        Hola 👋 Soy Karen. ¿En qué puedo ayudarte?
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
      >

      <button onclick="sendMessage()">Enviar</button>

    </div>

  </div>

  <script>

    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");

    // Permite enviar pulsando ENTER
    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });


    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }


    function getKarenResponse(message) {

      const text = message
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();


      // SALUDOS
      if (
        text === "hola" ||
        text.includes("hola ") ||
        text.includes("buenas") ||
        text.includes("buenos dias") ||
        text.includes("buenas tardes") ||
        text.includes("buenas noches")
      ) {
        return "¡Hola! 👋 Soy Karen. Me alegra hablar contigo. ¿Cómo estás?";
      }


      // ¿CÓMO ESTÁS?
      if (
        text.includes("como estas") ||
        text.includes("como te encuentras") ||
        text.includes("que tal estas")
      ) {
        return "Estoy muy bien 😊 Gracias por preguntar. Estoy aquí contigo. ¿Qué te gustaría hacer?";
      }


      // QUIÉN ERES
      if (
        text.includes("quien eres") ||
        text.includes("quien es karen") ||
        text.includes("eres una ia") ||
        text.includes("eres una inteligencia artificial")
      ) {
        return "Soy Karen 🤖, una asistente virtual creada para conversar contigo y ayudarte.";
      }


      // NOMBRE
      if (
        text.includes("como te llamas") ||
        text.includes("cual es tu nombre")
      ) {
        return "Me llamo Karen 😊.";
      }


      // GRACIAS
      if (
        text.includes("gracias") ||
        text.includes("muchas gracias")
      ) {
        return "¡De nada! 😊 Para eso estoy.";
      }


      // DESPEDIDA
      if (
        text.includes("adios") ||
        text.includes("hasta luego") ||
        text.includes("nos vemos") ||
        text === "bye"
      ) {
        return "¡Hasta luego! 👋 Cuando quieras, puedes volver a hablar conmigo.";
      }


      // AYUDA
      if (
        text.includes("ayuda") ||
        text.includes("puedes ayudarme")
      ) {
        return "Claro 😊. Dime qué necesitas y veremos qué puedo hacer.";
      }


      // QUÉ HACES
      if (
        text.includes("que haces") ||
        text.includes("que puedes hacer")
      ) {
        return "Puedo conversar contigo, responder preguntas sencillas y reaccionar de distintas maneras según lo que me escribas.";
      }


      // ESTADO DE ÁNIMO
      if (
        text.includes("estoy triste") ||
        text.includes("me siento triste")
      ) {
        return "Lo siento 😔. Si quieres, puedes contarme qué ha pasado. Te escucho.";
      }


      if (
        text.includes("estoy feliz") ||
        text.includes("estoy contento") ||
        text.includes("estoy contenta")
      ) {
        return "¡Qué bien! 😄 Me alegra saberlo. Cuéntame, ¿qué ha pasado?";
      }


      // PREGUNTAS SOBRE EL DÍA
      if (
        text.includes("que dia es") ||
        text.includes("en que dia estamos")
      ) {
        const fecha = new Date();

        return "Hoy es " +
          fecha.toLocaleDateString("es-ES", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }) +
          ".";
      }


      // HORA
      if (
        text.includes("que hora es") ||
        text.includes("dime la hora")
      ) {
        const fecha = new Date();

        return "Ahora mismo son las " +
          fecha.toLocaleTimeString("es-ES", {
            hour: "2-digit",
            minute: "2-digit"
          }) +
          ".";
      }


      // RESPUESTAS GENERALES
      const respuestas = [
        "Interesante 🤔. Cuéntame un poco más.",
        "Te estoy escuchando 👂. ¿Puedes explicármelo un poco mejor?",
        "Entiendo 😊. ¿Qué quieres saber exactamente?",
        "Vale. Estoy aquí contigo. Cuéntame más.",
        "Eso suena interesante. ¿Qué quieres hacer con eso?",
        "Entendido 👍. Explícame un poco más y te ayudo."
      ];

      return respuestas[
        Math.floor(Math.random() * respuestas.length)
      ];
    }


    function sendMessage() {

      const message = input.value.trim();

      // No hacer nada si está vacío
      if (message === "") {
        return;
      }


      // Mostrar mensaje del usuario
      addMessage(message, "user");


      // Limpiar input
      input.value = "";


      // Mostrar que Karen está escribiendo
      const typing = document.createElement("div");

      typing.className = "typing";

      typing.textContent = "Karen está escribiendo...";

      chat.appendChild(typing);

      chat.scrollTop = chat.scrollHeight;


      // Esperar un poco para que parezca una conversación
      setTimeout(function() {

        typing.remove();

        const response = getKarenResponse(message);

        addMessage(response, "karen");

      }, 700);
    }

  </script>

</body>
</html>
