<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karen AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 600px;
      height: 100vh;
      max-height: 850px;
      background: #111827;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 18px;
      background: #1e293b;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #334155;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
    }

    .header-info h1 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      margin-top: 4px;
      color: #4ade80;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 18px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user {
      align-self: flex-end;
      background: #7c3aed;
      border-bottom-right-radius: 5px;
    }

    .message.karen {
      align-self: flex-start;
      background: #273449;
      border-bottom-left-radius: 5px;
    }

    .typing {
      display: none;
      align-self: flex-start;
      background: #273449;
      padding: 12px 16px;
      border-radius: 18px;
      color: #cbd5e1;
    }

    .input-area {
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      background: #0f172a;
      color: white;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
    }

    #messageInput::placeholder {
      color: #94a3b8;
    }

    #sendButton {
      border: none;
      background: #7c3aed;
      color: white;
      padding: 0 18px;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
    }

    #sendButton:active {
      transform: scale(0.96);
    }

    .welcome {
      text-align: center;
      color: #94a3b8;
      margin: 10px 0 5px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="avatar">K</div>

      <div class="header-info">
        <h1>Karen AI</h1>
        <div class="status">● En línea</div>
      </div>
    </div>

    <div id="chat">

      <div class="welcome">
        Karen AI está lista para hablar contigo.
      </div>

      <div class="message karen">
        Hola 👋 Soy Karen. ¿En qué puedo ayudarte?
      </div>

    </div>

    <div id="typing" class="typing">
      Karen está escribiendo...
    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
      >

      <button id="sendButton">
        Enviar
      </button>

    </div>

  </div>

  <script>

    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const sendButton = document.getElementById("sendButton");
    const typing = document.getElementById("typing");


    function addMessage(text, sender) {

      const message = document.createElement("div");

      message.className = "message " + sender;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }


    function getKarenResponse(message) {

      const text = message
        .toLowerCase()
        .trim();


      // SALUDOS

      if (
        text === "hola" ||
        text === "holaa" ||
        text === "hola!" ||
        text === "buenas" ||
        text.includes("buenos días") ||
        text.includes("buenas tardes") ||
        text.includes("buenas noches")
      ) {
        return "¡Hola! 👋 Soy Karen. Qué gusto hablar contigo. ¿Cómo estás?";
      }


      // CÓMO ESTÁS

      if (
        text.includes("cómo estás") ||
        text.includes("como estas") ||
        text.includes("que tal estás") ||
        text.includes("qué tal estás")
      ) {
        return "Estoy muy bien, gracias por preguntar 😊. Aquí estoy contigo. ¿Y tú, cómo estás?";
      }


      // QUIÉN ERES

      if (
        text.includes("quién eres") ||
        text.includes("quien eres") ||
        text.includes("qué eres") ||
        text.includes("que eres")
      ) {
        return "Soy Karen AI 🤖. Estoy aquí para conversar contigo, responder preguntas y ayudarte.";
      }


      // NOMBRE

      if (
        text.includes("cómo te llamas") ||
        text.includes("como te llamas") ||
        text.includes("tu nombre")
      ) {
        return "Me llamo Karen 😊.";
      }


      // GRACIAS

      if (
        text.includes("gracias") ||
        text.includes("muchas gracias")
      ) {
        return "¡De nada! 😊 Me alegra poder ayudarte.";
      }


      // ADIÓS

      if (
        text === "adiós" ||
        text === "adios" ||
        text === "hasta luego" ||
        text.includes("me voy")
      ) {
        return "¡Hasta luego! 👋 Cuando quieras volver a hablar, aquí estaré.";
      }


      // BIEN

      if (
        text === "bien" ||
        text.includes("estoy bien") ||
        text.includes("muy bien")
      ) {
        return "¡Me alegro mucho! 😊 ¿Qué te gustaría hacer ahora?";
      }


      // MAL / TRISTE

      if (
        text.includes("estoy mal") ||
        text.includes("estoy triste") ||
        text.includes("triste")
      ) {
        return "Vaya... 😔 Si quieres, puedes contarme qué ha pasado. Te escucho.";
      }


      // AYUDA

      if (
        text.includes("ayuda") ||
        text.includes("ayúdame") ||
        text.includes("ayudame")
      ) {
        return "Claro 👍. Dime qué necesitas y vamos paso a paso.";
      }


      // QUÉ HACES

      if (
        text.includes("qué haces") ||
        text.includes("que haces")
      ) {
        return "Estoy aquí hablando contigo 😊. Puedes preguntarme lo que quieras.";
      }


      // CHISTE

      if (
        text.includes("chiste") ||
        text.includes("cuéntame algo gracioso") ||
        text.includes("cuentame algo gracioso")
      ) {
        return "Claro 😂. ¿Por qué el ordenador fue al médico? Porque tenía un virus.";
      }


      // HORA

      if (
        text.includes("qué hora") ||
        text.includes("que hora")
      ) {
        const ahora = new Date();

        return "Ahora mismo son las " +
          ahora.toLocaleTimeString("es-ES", {
            hour: "2-digit",
            minute: "2-digit"
          }) +
          " ⏰.";
      }


      // PREGUNTAS GENERALES

      if (text.includes("qué puedes hacer") || text.includes("que puedes hacer")) {
        return "Puedo conversar contigo, responder preguntas sencillas, ayudarte con ideas, explicarte cosas y acompañarte en una conversación. 🤖";
      }


      // RESPUESTA POR DEFECTO

      return "Entiendo 😊. Cuéntame un poco más sobre eso y trataré de ayudarte.";
    }


    function sendMessage() {

      const message = input.value.trim();

      if (message === "") {
        return;
      }


      // Mostrar mensaje del usuario

      addMessage(message, "user");

      input.value = "";

      input.focus();


      // Mostrar que Karen está escribiendo

      typing.style.display = "block";

      chat.scrollTop = chat.scrollHeight;


      // Responder después de un pequeño tiempo

      setTimeout(function() {

        typing.style.display = "none";

        const response = getKarenResponse(message);

        addMessage(response, "karen");

      }, 700);

    }


    // Botón Enviar

    sendButton.addEventListener("click", sendMessage);


    // Tecla Enter

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    });


    // Enfocar automáticamente el campo

    input.focus();

  </script>

</body>
</html>
