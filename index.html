<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karen IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .app {
      max-width: 700px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: #1e293b;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #94a3b8;
      font-size: 18px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      padding: 14px 18px;
      margin-bottom: 12px;
      border-radius: 15px;
      max-width: 85%;
      line-height: 1.4;
    }

    .message.karen {
      background: #374151;
      margin-right: auto;
    }

    .message.user {
      background: #2563eb;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #1e293b;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🤖 Karen</h1>
      <p>Tu asistente de inteligencia artificial</p>
    </header>

    <div id="chat">

      <div class="message karen">
        Hola, soy Karen. 👋<br>
        Estoy aquí para ayudarte.
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Escribe tu mensaje..."
      >

      <button onclick="sendMessage()">Enviar</button>

    </div>

  </div>

  <script>

    function sendMessage() {

      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (message === "") {
        return;
      }

      // Mostrar mensaje del usuario
      chat.innerHTML += `
        <div class="message user">
          ${message}
        </div>
      `;

      const text = message.toLowerCase();

      let response;

      if (text.includes("hola")) {

        response = "¡Hola! 😊 Me alegra hablar contigo.";

      } else if (
        text.includes("cómo estás") ||
        text.includes("como estas")
      ) {

        response = "Estoy muy bien 😊. ¿En qué puedo ayudarte?";

      } else if (
        text.includes("quién te creó") ||
        text.includes("quien te creo")
      ) {

        response = "Fui creada por Rayan con ayuda de ChatGPT. 🤖";

      } else if (
        text.includes("tu nombre") ||
        text.includes("cómo te llamas") ||
        text.includes("como te llamas")
      ) {

        response = "Me llamo Karen. 🤖";

      } else if (
        text.includes("gracias")
      ) {

        response = "¡De nada! 😊";

      } else {

        response = "Todavía estoy aprendiendo 🤖📚. Pero estoy aquí para ayudarte.";

      }

      // Responder Karen después de un momento
      setTimeout(function() {

        chat.innerHTML += `
          <div class="message karen">
            ${response}
          </div>
        `;

        chat.scrollTop = chat.scrollHeight;

      }, 500);

      // Limpiar el cuadro de texto
      input.value = "";

    }

    // También permite enviar con Enter
    document.getElementById("messageInput").addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
