<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karen-AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 20px 0;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #94a3b8;
    }

    #chat {
      background: #1e293b;
      border-radius: 15px;
      padding: 15px;
      min-height: 400px;
      margin-bottom: 15px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .karen {
      background: #334155;
    }

    .user {
      background: #2563eb;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🤖 Karen</h1>
      <p>Tu asistente de inteligencia artificial</p>
    </header>

    <div id="chat">

      <div class="message karen">
        Hola, soy Karen. 👋<br>
        Estoy aquí para ayudarte.
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Escribe tu mensaje..."
      >

      <button onclick="sendMessage()">
        Enviar
      </button>

    </div>

  </div>

  <script>

    function sendMessage() {

      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (message === "") {
        return;
      }

      // Mostrar mensaje del usuario
      chat.innerHTML += `
        <div class="message user">
          ${message}
        </div>
      `;

      // Respuesta de Karen
      chat.innerHTML += `
        <div class="message karen">
          Hola 👋 Soy Karen. He recibido tu mensaje.
        </div>
      `;

      // Limpiar el cuadro de texto
      input.value = "";

      // Bajar el chat automáticamente
      chat.scrollTop = chat.scrollHeight;
    }

    // También permite enviar pulsando Enter
    document.getElementById("messageInput").addEventListener("keydown", function(event) {

      if (event.key === "Enter") {
        sendMessage();
      }

    });

  </script>

</body>
</html>
