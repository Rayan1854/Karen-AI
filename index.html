<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karen AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      background: #111827;
    }

    .header {
      padding: 18px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 6px 0 0;
      color: #94a3b8;
      font-size: 14px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      margin-bottom: 12px;
      border-radius: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .message.user {
      margin-left: auto;
      background: #2563eb;
      border-bottom-right-radius: 4px;
    }

    .message.karen {
      margin-right: auto;
      background: #334155;
      border-bottom-left-radius: 4px;
    }

    .typing {
      color: #94a3b8;
      font-style: italic;
      margin: 10px 0;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #1e293b;
      border-top: 1px solid #334155;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #0f172a;
      color: white;
      font-size: 16px;
    }

    #messageInput::placeholder {
      color: #64748b;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    @media (max-width: 500px) {
      .app {
        max-height: none;
      }

      .message {
        max-width: 90%;
      }

      button {
        padding: 0 14px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>🤖 Karen AI</h1>
      <p>Tu asistente virtual</p>
    </div>

    <div id="chat">

      <div class="message karen">
        Hola 👋 Soy Karen. ¿En qué puedo ayudarte?
      </div>

    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Escribe tu mensaje..."
        autocomplete="off"
      >

      <button id="sendButton">Enviar</button>

    </div>

  </div>

  <script>

    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const sendButton = document.getElementById("sendButton");


    // ==============================
    // MOSTRAR MENSAJES
    // ==============================

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.className = "message " + type;

      message.textContent = text;

      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }


    // ==============================
    // LIMPIAR TEXTO
    // ==============================

    function limpiarTexto(texto) {

      return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }


    // ==============================
    // RESPUESTAS DE KAREN
    // ==============================

    function getKarenResponse(message) {

      const text = limpiarTexto(message);


      // SALUDOS

      if (
        text === "hola" ||
        text.includes("hola ") ||
        text.includes("buenas") ||
        text.includes("buenos dias") ||
        text.includes("buenas tardes") ||
        text.includes("buenas noches")
      ) {

        return "¡Hola! 👋 Soy Karen. Me alegra hablar contigo. ¿Cómo estás?";
      }


      // CÓMO ESTÁS

      if (
        text.includes("como estas") ||
        text.includes("como te encuentras") ||
        text.includes("que tal estas")
      ) {

        return "Estoy muy bien 😊. Gracias por preguntar. ¿En qué puedo ayudarte?";
      }


      // QUIÉN ERES

      if (
        text.includes("quien eres") ||
        text.includes("quien es karen") ||
        text.includes("eres una ia") ||
        text.includes("inteligencia artificial")
      ) {

        return "Soy Karen 🤖, tu asistente virtual. Estoy aquí para conversar contigo y ayudarte.";
      }


      // NOMBRE

      if (
        text.includes("como te llamas") ||
        text.includes("cual es tu nombre") ||
        text.includes("tu nombre")
      ) {

        return "Me llamo Karen 😊.";
      }


      // GRACIAS

      if (
        text.includes("gracias") ||
        text.includes("muchas gracias")
      ) {

        return "¡De nada! 😊 Para eso estoy.";
      }


      // DESPEDIDA

      if (
        text.includes("adios") ||
        text.includes("hasta luego") ||
        text.includes("nos vemos") ||
        text === "bye"
      ) {

        return "¡Hasta luego! 👋 Cuando quieras, puedes volver a hablar conmigo.";
      }


      // AYUDA

      if (
        text.includes("ayuda") ||
        text.includes("puedes ayudarme") ||
        text.includes("necesito ayuda")
      ) {

        return "Claro 😊. Dime qué necesitas y haré lo posible por ayudarte.";
      }


      // QUÉ PUEDES HACER

      if (
        text.includes("que puedes hacer") ||
        text.includes("que haces") ||
        text.includes("para que sirves")
      ) {

        return "Puedo conversar contigo, responder preguntas sencillas y ayudarte con diferentes tareas. 🤖";
      }


      // ESTOY TRISTE

      if (
        text.includes("estoy triste") ||
        text.includes("me siento triste") ||
        text.includes("estoy mal")
      ) {

        return "Lo siento 😔. Si quieres, cuéntame qué ha pasado. Estoy aquí para escucharte.";
      }


      // ESTOY FELIZ

      if (
        text.includes("estoy feliz") ||
        text.includes("estoy contento") ||
        text.includes("estoy contenta")
      ) {

        return "¡Qué bien! 😄 Me alegra mucho saberlo. Cuéntame qué ha pasado.";
      }


      // ME ABURRO

      if (
        text.includes("estoy aburrido") ||
        text.includes("estoy aburrida") ||
        text.includes("me aburro")
      ) {

        return "¡Pues vamos a solucionar eso! 😄 Podemos conversar, jugar o pensar en algo divertido.";
      }


      // HORA

      if (
        text.includes("que hora es") ||
        text.includes("dime la hora") ||
        text.includes("hora actual")
      ) {

        const fecha = new Date();

        return "Ahora mismo son las " +
          fecha.toLocaleTimeString("es-ES", {
            hour: "2-digit",
            minute: "2-digit"
          }) +
          ".";
      }


      // FECHA

      if (
        text.includes("que dia es") ||
        text.includes("en que dia estamos") ||
        text.includes("fecha de hoy")
      ) {

        const fecha = new Date();

        return "Hoy es " +
          fecha.toLocaleDateString("es-ES", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
          }) +
          ".";
      }


      // RESPUESTAS GENERALES

      const respuestas = [

        "Interesante 🤔. Cuéntame un poco más.",

        "Te estoy escuchando 👂. Explícamelo un poco mejor.",

        "Entiendo 😊. ¿Qué quieres saber exactamente?",

        "Vale 👍. Estoy aquí contigo. Cuéntame más.",

        "Eso suena interesante. ¿Qué quieres hacer con eso?",

        "Entendido 👍. Explícame un poco más y te ayudo.",

        "Hmm 🤔, quiero entenderte mejor. ¿Puedes explicarlo de otra manera?",

        "Claro. Cuéntame un poco más sobre eso 😊."

      ];


      return respuestas[
        Math.floor(Math.random() * respuestas.length)
      ];
    }


    // ==============================
    // ENVIAR MENSAJE
    // ==============================

    function sendMessage() {

      const message = input.value.trim();


      // No enviar mensajes vacíos

      if (message === "") {
        return;
      }


      // Mostrar mensaje del usuario

      addMessage(message, "user");


      // Limpiar input

      input.value = "";


      // Mostrar "Karen está escribiendo..."

      const typing = document.createElement("div");

      typing.className = "typing";

      typing.textContent = "Karen está escribiendo...";

      chat.appendChild(typing);

      chat.scrollTop = chat.scrollHeight;


      // Simular respuesta

      setTimeout(function() {

        typing.remove();

        const response = getKarenResponse(message);

        addMessage(response, "karen");

      }, 700);
    }


    // ==============================
    // BOTÓN ENVIAR
    // ==============================

    sendButton.addEventListener("click", function() {

      sendMessage();

    });


    // ==============================
    // ENTER PARA ENVIAR
    // ==============================

    input.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();

      }

    });


  </script>

</body>
</html>
